<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kingdom Command</title>
    <style>
      :root {
        --bg: #0d1728;
        --panel: rgba(13, 22, 35, 0.8);
        --panel-border: rgba(124, 210, 255, 0.5);
        --gold: #f3c86b;
        --wood: #8d5b3d;
        --food: #7ecb6a;
        --player: #4fc3f7;
        --enemy: #ef5350;
        --neutral: #d7d7d7;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(180deg, #07141d 0%, #0d1728 100%);
        color: #eaf6ff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .game-shell {
        width: min(1100px, 96vw);
        background: rgba(11, 20, 30, 0.9);
        border: 2px solid var(--panel-border);
        border-radius: 16px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
        overflow: hidden;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 14px 18px;
        background: rgba(17, 31, 49, 0.9);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .title h1 {
        margin: 0;
        font-size: 1.5rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .title span {
        color: #9ad9ff;
        font-size: 0.78rem;
        letter-spacing: 0.12em;
      }

      .resources {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .resource-pill {
        min-width: 120px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-weight: 700;
      }

      .resource-pill .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
      }

      .panel {
        display: grid;
        grid-template-columns: 240px 1fr;
      }

      .sidebar {
        background: rgba(14, 21, 31, 0.9);
        border-right: 1px solid rgba(255, 255, 255, 0.1);
        padding: 18px 14px;
      }

      .card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 14px;
      }

      .card h2 {
        margin: 0 0 10px;
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #9fd8ff;
      }

      .button-grid {
        display: grid;
        gap: 10px;
      }

      button {
        width: 100%;
        padding: 10px 12px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(180deg, #2a7ad4, #1d4d97);
        color: white;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.1s ease, filter 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
        filter: brightness(1.08);
      }

      button:active {
        transform: translateY(0);
      }

      .button-meta {
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        margin-top: 8px;
        opacity: 0.9;
      }

      .status-box {
        font-size: 0.82rem;
        line-height: 1.5;
      }

      canvas {
        display: block;
        width: 100%;
        height: 620px;
        background: linear-gradient(180deg, #163143 0%, #0d1d2f 100%);
      }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <div class="top-bar">
        <div class="title">
          <h1>Kingdom Command</h1>
          <span>One kingdom. One war.</span>
        </div>
        <div class="resources">
          <div class="resource-pill"><span class="dot" style="background: var(--gold);"></span> Gold <strong id="goldValue">0</strong></div>
          <div class="resource-pill"><span class="dot" style="background: var(--wood);"></span> Wood <strong id="woodValue">0</strong></div>
          <div class="resource-pill"><span class="dot" style="background: var(--food);"></span> Food <strong id="foodValue">0</strong></div>
        </div>
      </div>

      <div class="panel">
        <aside class="sidebar">
          <div class="card">
            <h2>Raise Army</h2>
            <div class="button-grid">
              <div>
                <button id="recruitPeasant">Recruit Peasant</button>
                <div class="button-meta"><span>Cost: 10 gold</span><span>HP 24</span></div>
              </div>
              <div>
                <button id="recruitArcher">Recruit Archer</button>
                <div class="button-meta"><span>Cost: 18 gold</span><span>Ranged</span></div>
              </div>
              <div>
                <button id="recruitKnight">Recruit Knight</button>
                <div class="button-meta"><span>Cost: 30 gold</span><span>Heavy</span></div>
              </div>
            </div>
          </div>

          <div class="card">
            <h2>Kingdom</h2>
            <div class="status-box" id="kingdomStatus"></div>
          </div>

          <div class="card">
            <h2>Economy</h2>
            <div class="button-grid">
              <div>
                <button id="buildFarm">Build Farm</button>
                <div class="button-meta"><span>Cost: 16 wood</span><span>+ food</span></div>
              </div>
              <div>
                <button id="buildLumberMill">Build Lumber Mill</button>
                <div class="button-meta"><span>Cost: 15 wood</span><span>+ wood</span></div>
              </div>
            </div>
          </div>
        </aside>

        <canvas id="gameCanvas" width="860" height="620"></canvas>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      const goldValue = document.getElementById('goldValue');
      const woodValue = document.getElementById('woodValue');
      const foodValue = document.getElementById('foodValue');
      const kingdomStatus = document.getElementById('kingdomStatus');

      function hashString(str) {
        let h = 0;
        for (let i = 0; i < str.length; i++) {
          h = (h * 31 + str.charCodeAt(i)) >>> 0;
        }
        return h;
      }

      function makeTerritory(id, name, owner, x, y, color, radius = 32) {
        const points = [];
        const seed = hashString(id);
        for (let i = 0; i < 8; i++) {
          const angle = (Math.PI * 2 * i) / 8;
          const drift = 0.84 + (((seed >> ((i % 5) * 3)) & 7) / 16);
          const r = radius * drift;
          points.push({ x: x + Math.cos(angle) * r, y: y + Math.sin(angle) * r });
        }
        return { id, name, owner, x, y, radius, points, color, capture: 0, spawnTimer: 2 + Math.random() * 2.5 };
      }

      function buildWorld() {
        const defs = [
          ['iron-crown', 'Iron Crown', 'player', 140, 260, '#4fc3f7'],
          ['river-glade', 'River Glade', 'player', 110, 500, '#4fc3f7'],
          ['moss-gate', 'Moss Gate', 'neutral', 150, 170, '#d7d7d7'],
          ['stone-ward', 'Stone Ward', 'neutral', 260, 120, '#d7d7d7'],
          ['sun-gate', 'Sun Gate', 'enemy', 330, 180, '#ef5350'],
          ['frost-basin', 'Frost Basin', 'enemy', 470, 120, '#ef5350'],
          ['ashen-ford', 'Ashen Ford', 'neutral', 610, 170, '#d7d7d7'],
          ['storm-spur', 'Storm Spur', 'enemy', 720, 150, '#ef5350'],
          ['gale-vault', 'Gale Vault', 'enemy', 800, 90, '#ef5350'],
          ['iron-falls', 'Iron Falls', 'neutral', 780, 235, '#d7d7d7'],
          ['red-ridge', 'Red Ridge', 'enemy', 780, 360, '#ef5350'],
          ['grave-dune', 'Grave Dune', 'enemy', 820, 490, '#ef5350'],
          ['cinder-hall', 'Cinder Hall', 'enemy', 700, 300, '#ef5350'],
          ['glass-falls', 'Glass Falls', 'neutral', 620, 290, '#d7d7d7'],
          ['salt-marsh', 'Salt Marsh', 'neutral', 700, 500, '#d7d7d7'],
          ['drift-veil', 'Drift Veil', 'neutral', 760, 560, '#d7d7d7'],
          ['copper-reef', 'Copper Reef', 'neutral', 630, 645, '#d7d7d7'],
          ['golden-harbor', 'Golden Harbor', 'neutral', 500, 610, '#d7d7d7'],
          ['misty-pines', 'Misty Pines', 'neutral', 450, 700, '#d7d7d7'],
          ['wren-moor', 'Wren Moor', 'enemy', 320, 690, '#ef5350'],
          ['wild-steppe', 'Wild Steppe', 'neutral', 300, 580, '#d7d7d7'],
          ['crimson-pass', 'Crimson Pass', 'enemy', 360, 500, '#ef5350'],
          ['black-water', 'Black Water', 'neutral', 500, 450, '#d7d7d7'],
          ['mire-bridge', 'Mire Bridge', 'neutral', 570, 385, '#d7d7d7'],
          ['ember-fields', 'Ember Fields', 'neutral', 470, 260, '#d7d7d7'],
          ['hollow-cross', 'Hollow Cross', 'neutral', 170, 300, '#d7d7d7'],
          ['sunken-road', 'Sunken Road', 'neutral', 290, 330, '#d7d7d7'],
          ['thorn-hold', 'Thorn Hold', 'neutral', 280, 430, '#d7d7d7'],
          ['old-forest', 'Old Forest', 'neutral', 200, 430, '#d7d7d7'],
          ['brass-grove', 'Brass Grove', 'neutral', 170, 630, '#d7d7d7'],
          ['deep-hedge', 'Deep Hedge', 'neutral', 80, 660, '#d7d7d7'],
          ['cloud-break', 'Cloud Break', 'neutral', 210, 70, '#d7d7d7'],
          ['sable-pit', 'Sable Pit', 'neutral', 90, 90, '#d7d7d7'],
          ['white-vale', 'White Vale', 'enemy', 420, 90, '#ef5350'],
          ['barrow-hill', 'Barrow Hill', 'neutral', 330, 270, '#d7d7d7'],
          ['noble-trench', 'Noble Trench', 'neutral', 530, 320, '#d7d7d7'],
          ['viper-spring', 'Viper Spring', 'neutral', 560, 190, '#d7d7d7']
        ];

        const territories = defs.map(([id, name, owner, x, y, color]) => makeTerritory(id, name, owner, x, y, color));
        const roads = [
          ['iron-crown', 'river-glade'], ['iron-crown', 'hollow-cross'], ['iron-crown', 'old-forest'], ['iron-crown', 'moss-gate'],
          ['river-glade', 'old-forest'], ['river-glade', 'deep-hedge'], ['river-glade', 'brass-grove'],
          ['moss-gate', 'cloud-break'], ['moss-gate', 'stone-ward'], ['moss-gate', 'hollow-cross'],
          ['stone-ward', 'sun-gate'], ['stone-ward', 'white-vale'], ['stone-ward', 'cloud-break'],
          ['sun-gate', 'white-vale'], ['sun-gate', 'barrow-hill'], ['sun-gate', 'frost-basin'],
          ['white-vale', 'frost-basin'], ['white-vale', 'cloud-break'],
          ['frost-basin', 'ashen-ford'], ['frost-basin', 'storm-spur'], ['frost-basin', 'viper-spring'],
          ['ashen-ford', 'viper-spring'], ['ashen-ford', 'glass-falls'], ['ashen-ford', 'storm-spur'],
          ['storm-spur', 'gale-vault'], ['storm-spur', 'cinder-hall'], ['storm-spur', 'glass-falls'],
          ['gale-vault', 'iron-falls'], ['gale-vault', 'storm-spur'],
          ['iron-falls', 'red-ridge'], ['iron-falls', 'cinder-hall'],
          ['red-ridge', 'cinder-hall'], ['red-ridge', 'grave-dune'], ['red-ridge', 'salt-marsh'],
          ['grave-dune', 'salt-marsh'], ['grave-dune', 'drift-veil'],
          ['cinder-hall', 'glass-falls'], ['cinder-hall', 'mire-bridge'], ['cinder-hall', 'salt-marsh'],
          ['glass-falls', 'mire-bridge'], ['glass-falls', 'noble-trench'], ['glass-falls', 'viper-spring'],
          ['mire-bridge', 'black-water'], ['mire-bridge', 'noble-trench'], ['mire-bridge', 'salt-marsh'],
          ['black-water', 'noble-trench'], ['black-water', 'ember-fields'], ['black-water', 'crimson-pass'],
          ['noble-trench', 'ember-fields'], ['noble-trench', 'viper-spring'], ['noble-trench', 'barrow-hill'],
          ['ember-fields', 'barrow-hill'], ['ember-fields', 'sunken-road'], ['ember-fields', 'thorn-hold'],
          ['barrow-hill', 'sun-gate'], ['barrow-hill', 'sunken-road'],
          ['hollow-cross', 'sunken-road'], ['hollow-cross', 'old-forest'], ['hollow-cross', 'moss-gate'],
          ['old-forest', 'thorn-hold'], ['old-forest', 'sunken-road'],
          ['sunken-road', 'thorn-hold'], ['sunken-road', 'wild-steppe'], ['sunken-road', 'crimson-pass'],
          ['thorn-hold', 'crimson-pass'], ['thorn-hold', 'wild-steppe'], ['thorn-hold', 'wren-moor'],
          ['crimson-pass', 'wild-steppe'], ['crimson-pass', 'wren-moor'], ['crimson-pass', 'black-water'],
          ['wild-steppe', 'wren-moor'], ['wild-steppe', 'golden-harbor'], ['wild-steppe', 'brass-grove'],
          ['wren-moor', 'golden-harbor'], ['wren-moor', 'misty-pines'], ['wren-moor', 'brass-grove'],
          ['golden-harbor', 'misty-pines'], ['golden-harbor', 'copper-reef'], ['golden-harbor', 'drift-veil'],
          ['misty-pines', 'copper-reef'], ['misty-pines', 'brass-grove'], ['misty-pines', 'deep-hedge'],
          ['copper-reef', 'drift-veil'], ['copper-reef', 'salt-marsh'],
          ['drift-veil', 'salt-marsh'],
          ['brass-grove', 'deep-hedge'], ['brass-grove', 'river-glade'],
          ['deep-hedge', 'river-glade']
        ];

        return { territories, roads };
      }

      const world = buildWorld();
      const territoryLookup = new Map(world.territories.map((territory) => [territory.id, territory]));

      const playerKingdom = {
        name: 'Iron Crown',
        homeId: 'iron-crown',
        gold: 60,
        wood: 60,
        food: 60,
        goldIncome: 0.20,
        woodIncome: 0.15,
        foodIncome: 0.15,
        farmLevel: 0,
        lumberLevel: 0,
        units: []
      };

      const allUnits = [];
      let lastFrame = 0;
      let gameOver = false;
      let victory = false;

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function getDistance(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      function polygonContainsPoint(points, x, y) {
        let inside = false;
        for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
          const xi = points[i].x;
          const yi = points[i].y;
          const xj = points[j].x;
          const yj = points[j].y;
          const condition = ((yi > y) !== (yj > y)) && (x < ((xj - xi) * (y - yi)) / (yj - yi + 0.00001) + xi);
          if (condition) inside = !inside;
        }
        return inside;
      }

      function territoryContainsPoint(territory, x, y) {
        return polygonContainsPoint(territory.points, x, y);
      }

      function findTerritoryAt(x, y) {
        return world.territories.find((territory) => territoryContainsPoint(territory, x, y)) || null;
      }

      function getControlledTerritories(owner) {
        return world.territories.filter((territory) => territory.owner === owner).length;
      }

      function findPath(startId, endId) {
        if (startId === endId) return [startId];
        const graph = new Map();
        world.territories.forEach((territory) => graph.set(territory.id, []));
        world.roads.forEach(([a, b]) => {
          graph.get(a).push(b);
          graph.get(b).push(a);
        });

        const queue = [[startId]];
        const visited = new Set([startId]);
        while (queue.length > 0) {
          const path = queue.shift();
          const current = path[path.length - 1];
          if (current === endId) return path;
          for (const next of graph.get(current) || []) {
            if (visited.has(next)) continue;
            visited.add(next);
            queue.push([...path, next]);
          }
        }
        return [startId];
      }

      function getNearestEnemyTerritory(unit) {
        let best = null;
        let bestDist = Infinity;
        for (const territory of world.territories) {
          if (unit.team === 'player' && territory.owner === 'player') continue;
          if (unit.team === 'enemy' && territory.owner === 'enemy') continue;
          const dist = getDistance(unit, territory);
          if (dist < bestDist) {
            bestDist = dist;
            best = territory;
          }
        }
        return best;
      }

      function updateHud() {
        goldValue.textContent = Math.floor(playerKingdom.gold);
        woodValue.textContent = Math.floor(playerKingdom.wood);
        foodValue.textContent = Math.floor(playerKingdom.food);

        const controlled = getControlledTerritories('player');
        const enemyControlled = world.territories.filter((territory) => territory.owner === 'enemy').length;
        const neutral = world.territories.filter((territory) => territory.owner === 'neutral').length;

        kingdomStatus.innerHTML = `
          <strong>${playerKingdom.name}</strong><br>
          Controlled territories: ${controlled}/${world.territories.length}<br>
          Enemy territories: ${enemyControlled}<br>
          Neutral zones: ${neutral}<br>
          Roads dictate army movement and capture speed.
        `;
      }

      function createUnit(type, team, x, y, territoryId) {
        const unitTypes = {
          peasant: { hp: 28, speed: 52, damage: 8, range: 18, cooldown: 0.8, color: team === 'player' ? '#79d4ff' : '#ff9a9a', radius: 8 },
          archer: { hp: 36, speed: 46, damage: 12, range: 120, cooldown: 1.0, color: team === 'player' ? '#9be7ff' : '#ffc0a8', radius: 9 },
          knight: { hp: 62, speed: 62, damage: 18, range: 24, cooldown: 0.9, color: team === 'player' ? '#5bc0ff' : '#ff7f7f', radius: 10 }
        };

        const template = unitTypes[type];
        const unit = {
          id: Math.random().toString(16).slice(2),
          type,
          team,
          x,
          y,
          radius: template.radius,
          hp: template.hp,
          maxHp: template.hp,
          speed: template.speed,
          damage: template.damage,
          range: template.range,
          cooldown: 0,
          attackSpeed: template.cooldown,
          color: template.color,
          path: [],
          currentTerritoryId: territoryId || playerKingdom.homeId,
          target: null
        };

        allUnits.push(unit);
        if (team === 'player') playerKingdom.units.push(unit);
        return unit;
      }

      function recruitUnit(type) {
        if (gameOver) return;
        const costs = {
          peasant: { gold: 12, wood: 5, food: 6 },
          archer: { gold: 20, wood: 9, food: 8 },
          knight: { gold: 32, wood: 15, food: 11 }
        };
        const cost = costs[type];
        if (playerKingdom.gold < cost.gold || playerKingdom.wood < cost.wood || playerKingdom.food < cost.food) return;

        playerKingdom.gold -= cost.gold;
        playerKingdom.wood -= cost.wood;
        playerKingdom.food -= cost.food;

        const home = territoryLookup.get(playerKingdom.homeId);
        const unit = createUnit(type, 'player', home.x + 16 + Math.random() * 10, home.y + 18 + Math.random() * 10, home.id);
        unit.path = [home.id];
        updateHud();
      }

      function buildFarm() {
        if (gameOver) return;
        if (playerKingdom.wood < 16 || playerKingdom.food < 12) return;
        playerKingdom.wood -= 16;
        playerKingdom.food -= 12;
        playerKingdom.farmLevel += 1;
        playerKingdom.foodIncome += 0.18;
        updateHud();
      }

      function buildLumberMill() {
        if (gameOver) return;
        if (playerKingdom.wood < 15 || playerKingdom.food < 14) return;
        playerKingdom.wood -= 15;
        playerKingdom.food -= 14;
        playerKingdom.lumberLevel += 1;
        playerKingdom.woodIncome += 0.18;
        updateHud();
      }

      document.getElementById('recruitPeasant').addEventListener('click', () => recruitUnit('peasant'));
      document.getElementById('recruitArcher').addEventListener('click', () => recruitUnit('archer'));
      document.getElementById('recruitKnight').addEventListener('click', () => recruitUnit('knight'));
      document.getElementById('buildFarm').addEventListener('click', buildFarm);
      document.getElementById('buildLumberMill').addEventListener('click', buildLumberMill);

      function updateTerritoryCapture() {
        for (const territory of world.territories) {
          const unitsHere = allUnits.filter((unit) => getDistance(unit, territory) <= territory.radius + 8);
          const playerUnitsHere = unitsHere.filter((unit) => unit.team === 'player').length;
          const enemyUnitsHere = unitsHere.filter((unit) => unit.team === 'enemy').length;

          if (playerUnitsHere > 0 && territory.owner !== 'player') territory.capture += playerUnitsHere * 0.9;
          if (enemyUnitsHere > 0 && territory.owner !== 'enemy') territory.capture -= enemyUnitsHere * 0.9;

          if (territory.capture >= 100) {
            territory.owner = 'player';
            territory.capture = 0;
            territory.color = '#4fc3f7';
          } else if (territory.capture <= -100) {
            territory.owner = 'enemy';
            territory.capture = 0;
            territory.color = '#ef5350';
          }

          territory.capture = clamp(territory.capture, -100, 100);
        }
      }

      function addResourceIncome() {
        const controlled = getControlledTerritories('player');
        playerKingdom.gold += 0.10 + controlled * 0.02;
        playerKingdom.food += playerKingdom.foodIncome + controlled * 0.01;
        playerKingdom.wood += playerKingdom.woodIncome + controlled * 0.01;
      }

      function spawnEnemyUnits(dt) {
        for (const territory of world.territories) {
          if (territory.owner !== 'enemy') continue;
          territory.spawnTimer -= dt;
          if (territory.spawnTimer > 0) continue;

          const roll = Math.random();
          const type = roll < 0.58 ? 'peasant' : roll < 0.85 ? 'archer' : 'knight';
          const unit = createUnit(type, 'enemy', territory.x + (Math.random() - 0.5) * 18, territory.y + (Math.random() - 0.5) * 18, territory.id);
          unit.path = [territory.id];
          territory.spawnTimer = 3.5 + Math.random() * 2.2;
        }
      }

      function getNearestEnemyUnit(unit) {
        let best = null;
        let bestDist = Infinity;
        for (const candidate of allUnits) {
          if (candidate.team === unit.team) continue;
          const dist = getDistance(unit, candidate);
          if (dist < bestDist) {
            bestDist = dist;
            best = candidate;
          }
        }
        return best;
      }

      function dealDamage(attacker, target) {
        if (!target || target.hp <= 0) return;
        target.hp -= attacker.damage;
        if (target.hp <= 0) {
          target.hp = 0;
          if (attacker.team === 'player' && target.team === 'enemy') {
            playerKingdom.gold += 7;
          }
        }
      }

      function moveUnitToward(unit, targetX, targetY, dt) {
        const dx = targetX - unit.x;
        const dy = targetY - unit.y;
        const dist = Math.hypot(dx, dy) || 1;
        const step = Math.min(unit.speed * dt, dist);
        unit.x += (dx / dist) * step;
        unit.y += (dy / dist) * step;
      }

      function resolveOpposingCollisions() {
        for (let i = 0; i < allUnits.length; i++) {
          for (let j = i + 1; j < allUnits.length; j++) {
            const a = allUnits[i];
            const b = allUnits[j];
            if (a.team === b.team) continue;
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const dist = Math.hypot(dx, dy) || 0.001;
            const minDist = a.radius + b.radius + 4;
            if (dist < minDist) {
              const nx = dx / dist;
              const ny = dy / dist;
              const overlap = (minDist - dist) / 2;
              a.x -= nx * overlap;
              a.y -= ny * overlap;
              b.x += nx * overlap;
              b.y += ny * overlap;
            }
          }
        }
      }

      function updateUnits(dt) {
        for (const unit of allUnits) {
          if (unit.hp <= 0) continue;
          unit.cooldown = Math.max(0, unit.cooldown - dt);

          const nearestEnemy = getNearestEnemyUnit(unit);
          const currentTerritory = findTerritoryAt(unit.x, unit.y);

          if (nearestEnemy && getDistance(unit, nearestEnemy) <= unit.range + 22) {
            const dx = nearestEnemy.x - unit.x;
            const dy = nearestEnemy.y - unit.y;
            const dist = Math.hypot(dx, dy) || 1;
            if (dist <= unit.range) {
              if (unit.cooldown <= 0) {
                dealDamage(unit, nearestEnemy);
                unit.cooldown = unit.attackSpeed;
              }
            } else {
              moveUnitToward(unit, nearestEnemy.x, nearestEnemy.y, dt);
            }
          } else {
            if (!unit.path || unit.path.length === 0) {
              const targetTerritory = getNearestEnemyTerritory(unit);
              const origin = currentTerritory || territoryLookup.get(unit.currentTerritoryId) || territoryLookup.get(playerKingdom.homeId);
              if (origin && targetTerritory) {
                unit.path = findPath(origin.id, targetTerritory.id);
                unit.currentTerritoryId = origin.id;
              }
            }

            if (unit.path && unit.path.length > 0) {
              const nextId = unit.path[0];
              const target = territoryLookup.get(nextId);
              if (target) {
                const distToTarget = getDistance(unit, target);
                if (distToTarget <= 6) {
                  unit.x = target.x;
                  unit.y = target.y;
                  unit.currentTerritoryId = target.id;
                  unit.path.shift();
                } else {
                  moveUnitToward(unit, target.x, target.y, dt);
                }
              }
            }
          }

          if (currentTerritory) {
            const isHostile = (unit.team === 'player' && currentTerritory.owner !== 'player') || (unit.team === 'enemy' && currentTerritory.owner !== 'enemy');
            if (isHostile) {
              currentTerritory.capture += (unit.team === 'player' ? 1 : -1) * (unit.type === 'knight' ? 10 : unit.type === 'archer' ? 7.5 : 5.5) * dt;
            }
          }
        }

        resolveOpposingCollisions();
        updateTerritoryCapture();
        for (let i = allUnits.length - 1; i >= 0; i--) {
          if (allUnits[i].hp <= 0) allUnits.splice(i, 1);
        }
      }

      function handleCanvasClick(event) {
        if (gameOver) return;
        const rect = canvas.getBoundingClientRect();
        const x = (event.clientX - rect.left) * (canvas.width / rect.width);
        const y = (event.clientY - rect.top) * (canvas.height / rect.height);
        const clicked = findTerritoryAt(x, y);
        if (!clicked) return;

        for (const unit of allUnits) {
          if (unit.team !== 'player') continue;
          const origin = territoryLookup.get(unit.currentTerritoryId) || territoryLookup.get(playerKingdom.homeId);
          unit.path = origin ? findPath(origin.id, clicked.id) : [clicked.id];
          unit.target = clicked.id;
        }
      }

      canvas.addEventListener('click', handleCanvasClick);

      function drawRoads() {
        ctx.lineWidth = 6;
        ctx.strokeStyle = 'rgba(255,255,255,0.28)';
        for (const [a, b] of world.roads) {
          const ta = territoryLookup.get(a);
          const tb = territoryLookup.get(b);
          if (!ta || !tb) continue;
          ctx.beginPath();
          ctx.moveTo(ta.x, ta.y);
          ctx.lineTo(tb.x, tb.y);
          ctx.stroke();
        }
      }

      function drawTerritory(territory) {
        ctx.beginPath();
        ctx.moveTo(territory.points[0].x, territory.points[0].y);
        for (let i = 1; i < territory.points.length; i++) ctx.lineTo(territory.points[i].x, territory.points[i].y);
        ctx.closePath();
        ctx.fillStyle = territory.color;
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.stroke();

        ctx.fillStyle = '#eefaff';
        ctx.font = '11px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(territory.name, territory.x, territory.y + 4);

        if (territory.capture !== 0) {
          ctx.fillStyle = 'rgba(0,0,0,0.28)';
          ctx.fillRect(territory.x - 24, territory.y - territory.radius - 12, 48, 7);
          ctx.fillStyle = '#7df9b6';
          ctx.fillRect(territory.x - 24, territory.y - territory.radius - 12, 48 * (Math.abs(territory.capture) / 100), 7);
        }
      }

      function drawUnit(unit) {
        ctx.beginPath();
        ctx.fillStyle = unit.color;
        ctx.arc(unit.x, unit.y, unit.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0d1728';
        ctx.fillRect(unit.x - 12, unit.y - unit.radius - 10, 24, 5);
        ctx.fillStyle = '#7ce382';
        ctx.fillRect(unit.x - 12, unit.y - unit.radius - 10, 24 * (unit.hp / unit.maxHp), 5);
      }

      function drawBackground() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, '#1c3a4d');
        gradient.addColorStop(1, '#112433');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(255,255,255,0.045)';
        for (let x = 0; x < canvas.width; x += 40) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 40) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }
      }

      function drawVictoryText() {
        if (!gameOver) return;
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 42px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(victory ? 'Victory!' : 'Defeat', canvas.width / 2, canvas.height / 2 - 15);
        ctx.font = '20px Arial';
        ctx.fillText('Reload the page to play again', canvas.width / 2, canvas.height / 2 + 30);
      }

      function render() {
        drawBackground();
        drawRoads();
        for (const territory of world.territories) drawTerritory(territory);
        for (const unit of allUnits) drawUnit(unit);
        drawVictoryText();
      }

      function checkWinState() {
        const enemyTerritories = world.territories.filter((territory) => territory.owner === 'enemy').length;
        if (enemyTerritories === 0) {
          victory = true;
          gameOver = true;
        }

        const playerTerritories = world.territories.filter((territory) => territory.owner === 'player').length;
        if (playerTerritories === 0) {
          victory = false;
          gameOver = true;
        }
      }

      function update(dt) {
        if (gameOver) return;
        addResourceIncome();
        spawnEnemyUnits(dt);
        updateUnits(dt);
        checkWinState();
        updateHud();
      }

      function loop(timestamp) {
        const dt = Math.min((timestamp - lastFrame) / 1000 || 0.016, 0.033);
        lastFrame = timestamp;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      function initialize() {
        const home = territoryLookup.get(playerKingdom.homeId);
        for (let i = 0; i < 6; i++) {
          const unit = createUnit(i % 2 === 0 ? 'peasant' : 'archer', 'player', home.x + 18 + (i % 3) * 16, home.y + 18 + Math.floor(i / 3) * 16, home.id);
          unit.path = [home.id];
        }

        for (const territory of world.territories) {
          territory.spawnTimer = 2 + Math.random() * 2.8;
        }

        updateHud();
        requestAnimationFrame(loop);
      }

      initialize();
    </script>
  </body>
</html>
